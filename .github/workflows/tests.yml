name: P0 tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: leasefit
          POSTGRES_USER: leasefit
          POSTGRES_PASSWORD: disposable-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U leasefit -d leasefit'
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      SECRET_KEY: disposable-ci-only-key-64-characters-not-a-runtime-secret-123456789
      DEBUG: '1'
      POSTGRES_DB: leasefit
      POSTGRES_USER: leasefit
      POSTGRES_PASSWORD: disposable-ci-password
      POSTGRES_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py collectstatic --noinput
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --verbosity 2
      - run: python manage.py check --deploy
        env:
          DEBUG: '0'
          SECURE_SSL_REDIRECT: '1'
          SECURE_HSTS_SECONDS: '31536000'
