services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leasefit}
      POSTGRES_USER: ${POSTGRES_USER:-leasefit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  web:
    image: leasefit-mvp-web:latest
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
  listing-refresh:
    image: leasefit-mvp-web:latest
    pull_policy: never
    env_file: .env
    command: ["python", "manage.py", "refresh_metrapi_listings"]
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
