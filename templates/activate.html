{% extends "base.html" %}
{% block content %}

    <div class="eyebrow">LEASEFIT · ПРИГЛАШЕНИЕ</div>
    <h1>Добро пожаловать</h1>
    <p>{{ invitation.agency.name }} приглашает вас как {{ invitation.get_role_display|lower }}.</p>

    </form>
  </div>
{% endblock %}
