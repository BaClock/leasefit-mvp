{% extends "base.html" %}
{% block content %}
  <div class="auth-panel panel">
    <h1>Новый пароль</h1>{% if validlink %}<form method="post">{% csrf_token %}
      {% include "fields.html" %}<button>Сохранить пароль</button>
    </form>{% else %}<p>Ссылка истекла. <a href="{% url 'password_reset' %}">Запросите новую</a>.</p>{% endif %}</div>{% endblock %}
