<div class="requirement-entry"{% if entry.structured %} data-operating-requirement{% endif %}>
  <h3>{{ entry.label }}</h3>
  {% if entry.origin != "client" %}<p class="muted">Рекомендация шаблона · {{ entry.origin }}</p>{% endif %}
  <div class="entry-fields">
    {% for field in entry.fields %}
      <div class="field">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}</div>
  </div>
